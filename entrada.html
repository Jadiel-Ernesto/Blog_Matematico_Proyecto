<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="titulo-pagina">Cargando... - Blog Matemático</title>
    <style>
        /* Estilos copiados de index.html para unificar el diseño */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #7092BE; /* Mismo fondo principal que index.html */
            color: #0656c7;
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%; 
            max-width: 680px;  /* Ancho de la tarjeta */
            background: #ffffff; /* Fondo blanco de la tarjeta */
            padding: 36px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid #111a25;
        }

        header {
            border-bottom: 2px solid #1a5276;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .volver {
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .volver:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        small {
            font-size: 0.75rem;
            color: #7f8c8d;
        }

        #contenido-entrada {
            color: #334155;
        }
    </style>
</head>
<body>

    <main class="container">
        <header>
            <a href="index.html" class="volver">&larr; Volver al índice</a>
            <h1 id="titulo-entrada">Cargando título...</h1>
            <small id="fecha-entrada"></small>
        </header>

        <section id="contenido-entrada">
            <p>Cargando contenido...</p>
        </section>
    </main>

    <script src="posts.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');
        const postInfo = publicaciones.find(p => p.id === postId);
        const contenedor = document.getElementById('contenido-entrada');

        if (postInfo) {
            document.getElementById('titulo-pagina').textContent = postInfo.titulo + " - Blog Matemático";
            document.getElementById('titulo-entrada').textContent = postInfo.titulo;
            document.getElementById('fecha-entrada').textContent = "Publicado el: " + postInfo.fecha;

            const script = document.createElement('script');
            script.src = postInfo.archivo;
            script.onload = () => { contenedor.innerHTML = contenidoEntrada; };
            script.onerror = () => { contenedor.innerHTML = "<p>Error al cargar el contenido de la entrada.</p>"; };
            document.body.appendChild(script);
        } else {
            contenedor.innerHTML = "<p>Entrada no encontrada.</p>";
        }
    </script>
</body>
</html>
